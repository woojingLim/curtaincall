<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>커튼콜 이후 · 올림픽공원 공연 종료 혼잡 운영 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EEF1EC;--card:#fff;--ink:#101828;--sub:#475467;--muted:#8B95A7;--line:#E6E9EF;--soft:#F5F7FA;
  --brand:#2563EB;--brandSoft:#EAF1FF;--brandInk:#1D4ED8;
  --c0:#12A150;--c1:#D99A00;--c2:#F06A00;--c3:#E5383B;
  --c0s:#E7F6EE;--c1s:#FFF6DB;--c2s:#FFEFE3;--c3s:#FDECEC;
  --l5:#996CAC;--l8:#E6186C;--l9:#BDB092;
  --r:16px;--sh:0 8px 28px rgba(16,24,40,.12),0 1px 3px rgba(16,24,40,.08);
  --font:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
#app{position:fixed;inset:0}

/* ---------- 지도 ---------- */
#map{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.mapbtns{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
.mbtn{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--sub)}
.mbtn svg{width:20px;height:20px}
.mbtn:active{transform:scale(.96)}
.mapnote{position:absolute;left:12px;z-index:4;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:999px;backdrop-filter:blur(6px)}
.legendchip{position:absolute;z-index:4;display:flex;gap:10px;align-items:center;background:#fff;box-shadow:var(--sh);border-radius:999px;padding:6px 12px;font-size:11.5px;color:var(--sub)}
.legendchip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* 지도 위 SVG 요소 */
.stn{cursor:pointer}
.stn text{font-family:var(--font)}
.poi{cursor:pointer}

/* ---------- 상단 바 ---------- */
.top{position:absolute;z-index:10;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:stretch}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:9px 12px;text-align:left}
.search .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center}
.search .ic svg{width:18px;height:18px}
.search .tx{min-width:0;flex:1}
.search b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search small{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.search .chev{flex:none;color:var(--muted)}
.seg{display:flex;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:4px;gap:2px}
.seg button{padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}

/* ---------- 시트(모바일: 아래 / PC: 왼쪽) ---------- */
.sheet{position:absolute;z-index:9;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.14);display:flex;flex-direction:column;height:46vh;transition:height .28s cubic-bezier(.2,.8,.2,1)}
.sheet.min{height:150px}.sheet.max{height:calc(100% - 78px)}
.sheet.nodrag{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:ns-resize;touch-action:none}
.grab::before{content:"";width:40px;height:5px;border-radius:9px;background:#D0D5DD}
.tabs{flex:none;display:flex;gap:4px;padding:0 14px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--sub);white-space:nowrap}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-selected=true]{background:var(--brandSoft);color:var(--brandInk)}
#panel{flex:1;overflow-y:auto;padding:14px 14px 28px;overscroll-behavior:contain}
@media (min-width:960px){
  .top{left:16px;right:auto;width:432px;top:16px}
  .sheet,.sheet.min,.sheet.max{left:16px;right:auto;top:88px;bottom:16px;width:432px;height:auto;border-radius:20px;box-shadow:var(--sh)}
  .grab{display:none}
  .tabs{padding-top:10px}
}

/* ---------- 공통 조각 ---------- */
.sec{margin-bottom:18px}
.sec>h3{font-size:13px;font-weight:700;color:var(--sub);margin:0 2px 8px;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;color:var(--sub);border:1px solid transparent;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip small{font-weight:500;opacity:.75}
.chip.out{background:#fff;border-color:var(--line)}
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;color:#fff;font-size:11px;font-weight:800;line-height:1}
.lb.l5{background:var(--l5)}.lb.l8{background:var(--l8)}.lb.l9{background:var(--l9)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.lv{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.lv0{background:var(--c0s);color:var(--c0)}.lv1{background:var(--c1s);color:#A87400}.lv2{background:var(--c2s);color:var(--c2)}.lv3{background:var(--c3s);color:var(--c3)}
.lvx{background:var(--soft);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:14px}
.note a{color:var(--muted)}
details.src{margin-top:16px;font-size:11.5px;color:var(--muted)}
details.src summary{cursor:pointer;list-style:none;display:inline-flex;gap:4px;align-items:center}
details.src p{margin-top:6px;line-height:1.55}

/* 출발·목적지 박스 */
.trip{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.trip .tr{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;text-align:left}
.trip .tr+.tr{border-top:1px solid var(--line)}
.trip .pin{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.trip .pin svg{width:15px;height:15px}
.trip .from .pin{background:var(--brandSoft);color:var(--brand)}
.trip .to .pin{background:#FFF0F3;color:#E11D48}
.trip .lab{font-size:11.5px;color:var(--muted);display:block}
.trip .val{font-size:15px;font-weight:700}
.trip .val.ph{color:var(--muted);font-weight:600}
.trip .grow{flex:1;min-width:0}
.trip .vchips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.timechips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.timechips::-webkit-scrollbar{display:none}
.timechips input[type=time]{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;background:#fff}

/* 추천 카드 */
.opt{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.opt[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.opt>.hd{display:block;width:100%;text-align:left;padding:13px 14px}
.opt .t1{display:flex;align-items:center;gap:8px}
.opt .nm{font-size:16px;font-weight:800}
.opt .badge{font-size:11px;font-weight:800;color:#fff;background:var(--brand);padding:3px 8px;border-radius:999px}
.opt .why{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt .why span{font-size:11.5px;color:var(--sub);background:var(--soft);padding:3px 8px;border-radius:8px}
.opt .t2{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.opt .t2 b{color:var(--ink)}
.opt .t2 svg{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
.opt .ml{margin-left:auto}
.trains{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.trains::-webkit-scrollbar{display:none}
.tn{flex:none;border-radius:10px;background:var(--soft);padding:6px 9px;font-size:12px;line-height:1.3}
.tn b{display:block;font-size:14px}
.tn.ex{background:#FFF8E1}
.tn.ex i{font-style:normal;color:#A87400;font-weight:800;font-size:10.5px;margin-left:3px}
.tn.off{opacity:.45}
.opt .body{padding:0 14px 14px;border-top:1px dashed var(--line);margin-top:2px}
.steps{list-style:none;margin:12px 0 4px;position:relative}
.steps li{position:relative;padding:0 0 14px 34px;font-size:13.5px;line-height:1.45}
.steps li::before{content:"";position:absolute;left:11px;top:22px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .si{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--sub)}
.steps .si svg{width:14px;height:14px}
.steps small{display:block;color:var(--muted);font-size:12px}
.mini{margin-top:6px}
.mini svg{width:100%;height:auto;display:block}

/* 기다렸다 가기 */
.wait{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#F0F7FF,#F6F3FF);border-radius:var(--r);padding:13px 14px;margin-bottom:12px}
.wait .wi{flex:none;width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--brand)}
.wait .wi svg{width:18px;height:18px}
.wait b{font-size:14px}
.wait p{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.wait .chips{margin-top:8px}
.wait .chip{background:#fff;padding:6px 10px;font-size:12px}

/* 역 목록(목적지 없을 때) */
.srow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow .sn{font-size:14.5px;font-weight:700}
.srow .sm{font-size:12px;color:var(--muted);margin-top:2px}
.srow .grow{flex:1;min-width:0}

/* 주변 */
.poilist{display:flex;flex-direction:column;gap:8px}
.pc{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.pc[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.pc .pi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.pc .pi svg{width:20px;height:20px}
.pi.walk{background:#E9F7EF;color:#16834A}.pi.see{background:#F1EDFF;color:#6D4FD8}.pi.out{background:#E8F4FF;color:#1C6FD1}.pi.food{background:#FFF1E6;color:#D9620B}
.pc b{font-size:14.5px}
.pc p{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.45}
.pc .tg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pc .tg span{font-size:11px;color:var(--sub);background:var(--soft);border-radius:6px;padding:2px 7px}

/* 막차 */
.ltcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.ltcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ltcard .hd b{font-size:15px}
.lt{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.lt:first-of-type{border-top:0}
.lt .d{color:var(--sub)}
.lt .t b{font-size:14px}
.lt .t small{display:block;color:var(--muted);font-size:11.5px}
.lt .left{font-weight:700;font-size:12.5px;text-align:right}
.left.ok{color:var(--c0)}.left.warn{color:var(--c2)}.left.bad{color:var(--c3)}

/* 운영자 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--soft);border-radius:14px;padding:11px 12px}
.tile b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px}
.tile small{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.35}
.tile.hot{background:var(--c3s)}.tile.hot b{color:var(--c3)}
.tile.good{background:var(--c0s)}.tile.good b{color:#0E8443}
.card{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:12px}
.card h4{font-size:14.5px;font-weight:800}
.card .cap{font-size:12px;color:var(--muted);margin-top:2px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.leg i.ln{height:2px;border-radius:0;vertical-align:3px;border-top:2px dashed var(--sub);background:none;width:14px}
.ctl{margin:12px 0 4px}
.ctl .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.ctl output{color:var(--brand);font-weight:800}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.bars .br{display:grid;grid-template-columns:92px 1fr 70px;gap:8px;align-items:center;padding:7px 0;font-size:13px}
.bars .track{position:relative;height:10px;background:var(--soft);border-radius:9px}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.bars .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.bars .v{text-align:right;font-weight:700}
.bars .v small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.play{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--brand);padding:4px 0}
.play svg{width:14px;height:14px}

/* ---------- 오버레이(공연·목적지 고르기) ---------- */
.ov{position:fixed;inset:0;z-index:30;background:rgba(16,24,40,.35);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.ovbox{background:#fff;width:100%;max-width:560px;height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--sh)}
@media (min-width:960px){.ov{align-items:center}.ovbox{height:80vh;border-radius:22px}}
.ovhd{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.ovhd h2{font-size:17px;font-weight:800;flex:1}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sub)}
.x svg{width:20px;height:20px}
.sbox{margin:0 14px 10px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px}
.sbox svg{width:18px;height:18px;color:var(--muted);flex:none}
.sbox input{border:0;background:none;outline:none;flex:1;font-size:15px;min-width:0}
.ovchips{padding:0 14px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.ovchips::-webkit-scrollbar{display:none}
.ovlist{flex:1;overflow-y:auto;padding:0 8px 20px}
.mon{font-size:12px;font-weight:800;color:var(--muted);padding:12px 8px 6px}
.dayrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:12px}
.dayrow:hover{background:var(--soft)}
.dayrow[aria-current=true]{background:var(--brandSoft)}
.dbox{flex:none;width:48px;text-align:center;border-radius:10px;background:var(--soft);padding:6px 0}
.dbox b{display:block;font-size:16px;line-height:1.1}
.dbox small{font-size:11px;color:var(--sub)}
.dayrow .dt{min-width:0;flex:1}
.dayrow .dt b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .dt small{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill2{flex:none;font-size:11px;font-weight:800;color:#C2410C;background:#FFF1E6;border-radius:999px;padding:3px 8px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 6px}
.dcell{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);text-align:left}
.dcell[aria-pressed=true]{border-color:var(--brand);background:var(--brandSoft)}
.dcell b{font-size:15px}
.dcell small{font-size:11.5px;color:var(--muted)}
.dcell .lns{display:flex;gap:4px}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13.5px}
.mapbtns{top:80px}
.legendchip{left:12px;top:80px}
.mapnote{left:12px;top:118px}
@media (min-width:960px){.mapbtns{top:16px;right:16px}.legendchip{left:464px;top:16px}.mapnote{left:464px;top:auto;bottom:16px}}

.sec>h3 svg{width:15px;height:15px;flex:none}
.trip .tr>.muted svg{display:block}

.ident{background:linear-gradient(135deg,#101828,#1D2939);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.ident b{font-size:15.5px}
.ident p{font-size:12.5px;line-height:1.55;color:#D0D5DD;margin-top:4px}
.banner{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--sub);background:var(--soft);border-radius:12px;padding:8px 10px;margin-bottom:10px;line-height:1.45}
.banner svg{width:15px;height:15px;flex:none;margin-top:1px}
.legendchip b{margin-right:2px}

.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;font-weight:600}
.fld input{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;min-width:0;max-width:170px;background:#fff}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 100px 108px;gap:6px;align-items:center;margin-top:8px}
.prow .chip{justify-content:center;overflow:hidden;text-overflow:ellipsis;padding:8px 6px;font-size:12.5px}
.prow input,.prow select{border:1px solid var(--line);border-radius:10px;padding:7px 6px;font-size:13px;background:#fff;width:100%}
.prow input:disabled,.prow select:disabled{opacity:.4}
ul.chk{list-style:none;margin-top:8px}
ul.chk li{position:relative;padding:8px 0 8px 22px;font-size:13px;line-height:1.5;color:var(--sub);border-top:1px solid var(--line)}
ul.chk li:first-child{border-top:0}
ul.chk li::before{content:"";position:absolute;left:2px;top:13px;width:10px;height:10px;border-radius:3px;border:2px solid var(--brand)}
ul.chk b{color:var(--ink)}
.extlink{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 11px;border-radius:999px;background:#FEE500;color:#191919;font-size:12.5px;font-weight:700;text-decoration:none}
.extlink svg{width:14px;height:14px}
.wait .extlink{margin-top:8px}
.flow{list-style:none;counter-reset:f;margin:2px 0 0;padding:0;display:grid;gap:8px}
.flow li{counter-increment:f;position:relative;padding:10px 12px 10px 40px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.5}

// 종료 시각 이동: 종료 예정 간격 0분인 '정확히 두 공연'만. 작은 공연 몫(좌석 비율)의 초과 승차를 min분 뒤로 옮김. 인원 보존, 자정 이후는 overflow로 따로 셈
function stagger(obs,base,d,min){const shows=d.shows.filter(s=>s.k==='공연');if(shows.length!==2||d.gap!==0||shows.some(s=>!CAP[s.v]))return null;
  const ws=shows.map(s=>CAP[s.v]),w=Math.min(...ws)/(ws[0]+ws[1]),eh=Math.floor(endH(d)),H=[];for(let h=Math.max(6,eh-2);h<=Math.min(23,eh+2);h++)H.push(h);
  const nw=obs.slice(),ex=Array(24).fill(0);let overflow=0;
  for(const h of H){if(obs[h]!=null&&base[h]!=null){ex[h]=Math.max(0,obs[h]-base[h])*w;nw[h]-=ex[h]}}
  for(const h of H){const dest=h+min/60,lo=Math.floor(dest),f=dest-lo;for(const [i,part] of [[lo,1-f],[lo+1,f]]){const v=ex[h]*part;if(!v)continue;if(i>=24||nw[i]==null)overflow+=v;else nw[i]+=v}}
  const lo=H[0],hi=Math.min(23,H[H.length-1]+2),pk=a=>Math.max(...a.slice(lo,hi+1).filter(v=>v!=null));

// 대체 역 분산: 원래 피크 시간의 초과 승차(평일 평균 대비) 중 pct%를 4개 역에 '평일 평균 최고치까지의 여유'에 비례 배분. 여유를 넘는 몫은 배분하지 않음(미배분). 이동 뒤 비교 구간 최대치를 다시 계산
function altScenario(Sx,d,pct){const {ph,C}=peakOf(Sx,d),excess=Math.max(0,C[ph]-SBC[ph]),target=excess*pct/100;

  const peak=Math.max(...nc.slice(a,b+1).filter(v=>v!=null));return {ph,target,moved,after,center,peak,unallocated:target-moved}}

function summary(){const days=D.days.filter(d=>d.sub),pk=days.map(d=>{const p=peakOf(d.sub,d);return {d,ph:p.ph,v:p.mx,b:SBC[p.ph]}});

function calEnd(d){const e=endMin(d);if(!d.sub)return e;const {ph}=peakOf(d.sub,d);return ph*60>e&&ph*60-e<=90?ph*60:e} // 추정 종료보다 기록상 피크 시간대가 늦으면 그 시각을 "종료 직후"로 봄(화면에 밝힘)

const RUNTIME={'콘서트':150,'팬미팅·팬콘':120,'쇼케이스':90};

const gapCat=(n,gap)=>n===1?'single':gap===0?'0':(gap||0)>=60?'60+':'1-59';
function featOfDay(d){const vs=new Set(d.shows.map(s=>s.v).filter(v=>BIG.includes(v)));return {vs,kspo:vs.has('KSPO DOME'),eh:Math.floor(endH(d)),g:gapCat(d.n,d.gap),wd:wdGroup(d.wd),aud:d.aud||null}}
const sameSet=(a,b)=>a.size===b.size&&[...a].every(v=>b.has(v));
function simDist(q,f){let s=sameSet(q.vs,f.vs)?0:(q.kspo===f.kspo?1.5:3);s+=Math.abs(q.eh-f.eh)*.7;s+=q.g===f.g?0:1;s+=q.wd===f.wd?0:.5;

// q: {vs,kspo,eh,g,wd,aud} · 가장 가까운 k일(기본 7)의 피크 중앙값·최소~최대, 피크 시간대(추정 종료 대비 가장 흔한 위치)
function similarCases(q,k=7,excludeId=null){const pool=D.days.filter(d=>d.sub&&d.id!==excludeId).map(d=>({d,f:featOfDay(d),dist:simDist(q,featOfDay(d))}));
  pool.sort((a,b)=>a.dist-b.dist||(a.d.date<b.d.date?-1:1));const c=pool.slice(0,k).map(x=>{const p=peakOf(x.d.sub,x.d),pk=parkPeak(x.d);return {...x,ph:p.ph,pk:p.mx,park:pk?pk.mx:null}});
  const med=a=>{const v=[...a].sort((x,y)=>x-y),n=v.length;return n?(n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2):null};
  const pks=c.map(x=>x.pk),cnt={};c.forEach(x=>{const o=x.ph-x.f.eh;cnt[o]=(cnt[o]||0)+1});
  const off=+Object.entries(cnt).sort((a,b)=>b[1]-a[1]||Math.abs(a[0])-Math.abs(b[0])||a[0]-b[0])[0][0];const pv=c.map(x=>x.park).filter(v=>v!=null);
  return {cases:c,med:med(pks),lo:Math.min(...pks),hi:Math.max(...pks),ph:q.eh+off,park:pv.length?{med:med(pv),n:pv.length}:null}}
// 한 날씩 빼고 나머지로 맞혀 보기(LOO). useAud: 실제 관객 수를 '예상 관객 수'로 넣었다고 보고 계산

  const s=[...err].sort((a,b)=>a-b),n=days.length;return {n,medErr:(s[(n-1)>>1]+s[n>>1])/2,w30:err.filter(e=>e<=.3).length/n,cov:cov/n,h0:h0/n,h1:h1/n}}

function drawDyn(){const sc=px(),d=S.day;let s=lineTags(sc);const vxy=VN[S.venue];
  if(S.mode==='aud'){const tab=S.tab.aud;
    let groups=Object.keys(GRP),selG=null;
    if(tab==='route'&&S.dest){groups=[...new Set(OPTS.map(o=>o.g))];const so=OPTS.find(o=>o.key===S.sel);selG=so?.g}
    if(tab==='route'&&!S.dest&&S.stnSel)selG=S.stnSel;
    if(vxy&&tab!=='near'){groups.forEach(g=>{if(g===selG)return;const c=curve(vxy,ST[g]);s+=`<path d="${c.d}" fill="none" stroke="#98A2B3" stroke-width="${3*sc}" stroke-dasharray="${2*sc} ${7*sc}" stroke-linecap="round" opacity=".8"/>`});
      if(selG){const c=curve(vxy,ST[selG]);s+=`<path d="${c.d}" fill="none" stroke="#fff" stroke-width="${10*sc}" stroke-linecap="round"/><path d="${c.d}" fill="none" stroke="#2563EB" stroke-width="${6*sc}" stroke-linecap="round" stroke-dasharray="${.1*sc} ${10*sc}"/>`;
        s+=pill(c.m[0],c.m[1],`${walkOf(S.venue,selG)}분`,sc,{icon:'walk',bg:'#2563EB',fg:'#fff'})}}
    if(tab==='near'&&vxy){const p=M.poi.find(x=>x.id===S.poiSel&&x.xy);if(p){const c=curve(vxy,p.xy,.12);s+=`<path d="${c.d}" fill="none" stroke="#2563EB" stroke-width="${5*sc}" stroke-linecap="round" stroke-dasharray="${.1*sc} ${9*sc}"/>`+pill(c.m[0],c.m[1],`약 ${distMin(vxy,p.xy)}분`,sc,{icon:'walk',bg:'#2563EB',fg:'#fff'})}}
    Object.keys(GRP).forEach(g=>{const on=groups.includes(g);const arr=S.dep+walkOf(S.venue,g),c=crowdG(d,g,Math.floor(arr/60));s+=stnMarker(g,c,sc,{dim:!on,sel:g===selG})});
    if(tab==='near')M.poi.filter(p=>p.xy).forEach(p=>{const sel=p.id===S.poiSel,r=(sel?17:13)*sc,col={walk:'#16834A',see:'#6D4FD8',out:'#1C6FD1',food:'#D9620B'}[p.cat];
      s+=`<g class="poi" data-poi="${p.id}"><circle cx="${p.xy[0]}" cy="${p.xy[1]}" r="${r}" fill="${col}" stroke="#fff" stroke-width="${3*sc}" filter="url(#shd)"/><g transform="translate(${p.xy[0]-r*.62} ${p.xy[1]-r*.62}) scale(${r*1.24/24})" color="#fff">${IC[CAT[p.cat].ic].replace('<svg','<svg width="24" height="24"')}</g>${sel||sc<3.2?`<text x="${p.xy[0]}" y="${p.xy[1]+r+15*sc}" text-anchor="middle" font-size="${12*sc}" font-weight="700" fill="#101828" stroke="#fff" stroke-width="${4*sc}" paint-order="stroke">${esc(p.n)}</text>`:''}</g>`});
    s+=venueLabels(sc,[S.venue]);venuePins(sc,[S.venue]).forEach(x=>s+=x)}
  else if(S.tab.ops==='plan'){Object.keys(GRP).forEach(g=>{s+=stnMarker(g,null,sc,{dim:false,sel:false})});const vs=S.plan.shows.filter(x=>x.on).map(x=>x.v);s+=venueLabels(sc,vs);venuePins(sc,vs).forEach(x=>s+=x)}
  else{const hr=opsHour();Object.keys(GRP).forEach(g=>{const v=grpVal(d,g,hr),u=UMAX[g],r=v!=null?v/u:null,lv=r==null?null:r<.6?0:r<1?1:r<1.6?2:3,[x,y]=ST[g],R=(10+Math.sqrt(v||0)*.5)*sc;
      s+=`<g class="stn" data-stn="${g}"><circle cx="${x}" cy="${y}" r="${R}" fill="${lv==null?'#98A2B3':LV[lv].c}" fill-opacity=".28" stroke="${lv==null?'#98A2B3':LV[lv].c}" stroke-width="${2.5*sc}"/><circle cx="${x}" cy="${y}" r="${6*sc}" fill="${lv==null?'#98A2B3':LV[lv].c}" stroke="#fff" stroke-width="${2*sc}"/>`;
      const rt=r!=null?(r>=1?r.toFixed(1)+'배':Math.round(r*100)+'%'):'',t=innerWidth<600?`${GRP[g].n} ${rt}`:`${GRP[g].n} ${fmt(v)}명${rt?' · '+rt:''}`,fs=11.5*sc,w=t.length*fs*.86+fs*1.6,pos=LBL[g],off=R+8*sc;
      const cx=pos==='r'?x+off+w/2:pos==='l'?x-off-w/2:x,cy=pos==='t'?y-off-fs:pos==='b'?y+off+fs:y;s+=pill(cx,cy,t,sc,{fs:11.5})+`</g>`});
    venues(d).filter(v=>VN[v]).forEach(v=>{const [x,y]=VN[v];s+=`<circle cx="${x}" cy="${y}" r="${7*sc}" fill="#101828" stroke="#fff" stroke-width="${2.5*sc}"/>`+(innerWidth>=600||sc<2.2?`<text x="${x}" y="${y-12*sc}" text-anchor="middle" font-size="${11.5*sc}" font-weight="800" fill="#101828" stroke="#fff" stroke-width="${4*sc}" paint-order="stroke">${esc(shortV(v))}</text>`:'')})}
  elDyn.innerHTML=s}
function stnMarker(g,c,sc,o){const [x,y]=ST[g],col=c?LV[c.lv].c:'#98A2B3',r=(o.sel?13:10)*sc,lns=GRP[g].k.map(k=>SK[k].ln);
  const name=GRP[g].n,fs=12.5*sc,lw=(name.length*fs*.98)+(lns.length*16*sc)+fs*1.8,lh=fs*2.1,pos=LBL[g];
  let lx=x+r+8*sc,ly=y-lh/2;if(pos==='l')lx=x-r-8*sc-lw;if(pos==='b'){lx=x-lw/2+40*sc;ly=y+r+6*sc}if(pos==='t'){lx=x-lw/2;ly=y-r-6*sc-lh}
  let s=`<g class="stn" data-stn="${g}" opacity="${o.dim?.45:1}"><circle cx="${x}" cy="${y}" r="${r+5*sc}" fill="${col}" opacity=".22"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${col}" stroke-width="${(o.sel?5:4)*sc}"/>${o.sel?`<circle cx="${x}" cy="${y}" r="${r*.45}" fill="${col}"/>`:''}`;
  s+=`<g transform="translate(${lx} ${ly})"><rect width="${lw}" height="${lh}" rx="${lh/2}" fill="#fff" filter="url(#shd)" ${o.sel?`stroke="#2563EB" stroke-width="${2*sc}"`:''}/>`;
  lns.forEach((ln,i)=>{s+=`<circle cx="${fs*.95+i*16*sc}" cy="${lh/2}" r="${7*sc}" fill="${M.lines[ln].color}"/><text x="${fs*.95+i*16*sc}" y="${lh/2+3.6*sc}" text-anchor="middle" font-size="${9.5*sc}" font-weight="800" fill="#fff">${ln}</text>`});
  s+=`<text x="${fs*.95+lns.length*16*sc+2*sc}" y="${lh/2+fs*.36}" font-size="${fs}" font-weight="800" fill="#101828">${name}</text></g></g>`;return s}
function venueLabels(sc,skip){if(sc>2.6)return '';return Object.keys(VN).filter(v=>!skip.includes(v)).map(v=>`<text x="${VN[v][0]}" y="${VN[v][1]+4*sc}" text-anchor="middle" font-size="${11*sc}" font-weight="600" fill="#5E7352">${esc(shortV(v))}</text>`).join('')}
function venuePins(sc,vs){return vs.filter(v=>VN[v]).map(v=>{const [x,y]=VN[v],r=15*sc;
  return `<g data-v="${esc(v)}"><path d="M${x} ${y} l${-r*.75} ${-r*1.3} a${r} ${r} 0 1 1 ${r*1.5} 0 z" fill="#101828" stroke="#fff" stroke-width="${2.5*sc}" filter="url(#shd)"/><circle cx="${x}" cy="${y-r*1.95}" r="${r*.42}" fill="#fff"/>
  <text x="${x}" y="${y+16*sc}" text-anchor="middle" font-size="${12.5*sc}" font-weight="800" fill="#101828" stroke="#fff" stroke-width="${4*sc}" paint-order="stroke">${esc(shortV(v))}</text></g>`})}

  if(t.id==='planDate'&&t.value){S.plan.date=t.value;renderPanel();return}
  if(t.id==='planAud'){S.plan.aud=t.value;renderPanel();document.getElementById('planAud')?.focus();return}
  if(t.dataset.ps!=null&&t.value){S.plan.shows[+t.dataset.ps].s=t.value;renderPanel();return}
  if(t.dataset.pt!=null){S.plan.shows[+t.dataset.pt].t=t.value;renderPanel();return}});
$('#panel').addEventListener('input',e=>{const t=e.target;
  if(t.id==='depIn'&&t.value){const [h,m]=t.value.split(':').map(Number);let v=h*60+m;if(v<240)v+=1440;S.dep=v;S.depKey='custom';S.sel=null;renderPanel();drawDyn();document.getElementById('depIn')?.focus();return}
  if(t.id==='hourIn'){S.hour=+t.value;stopPlay();renderPanel();drawDyn();document.getElementById('hourIn')?.focus();return}
  if(t.id==='shIn'){S.shift=+t.value;renderPanel();document.getElementById('shIn')?.focus();return}
  if(t.id==='alIn'){S.alt=+t.value;renderPanel();document.getElementById('alIn')?.focus();return}});
function startPlay(){S.hour=12;S.playing=setInterval(()=>{S.hour=S.hour>=23?12:S.hour+1;renderPanel();drawDyn()},900);renderPanel()}
function stopPlay(){if(S.playing){clearInterval(S.playing);S.playing=null;if(S.mode==='ops')renderPanel()}}
function mapClick(el){if(!el)return;if(el.dataset.stn){if(S.mode==='ops'){S.tab.ops='stn';render();return}
    if(S.tab.aud!=='route'){S.tab.aud='route'}
    if(S.dest){const o=OPTS.find(x=>x.g===el.dataset.stn);if(o){S.sel=o.key;render();focusSel();setTimeout(()=>document.querySelector('.opt[aria-expanded=true]')?.scrollIntoView({block:'nearest',behavior:'smooth'}),50)}}
    else{S.stnSel=el.dataset.stn;render();focusSel()}return}
  if(el.dataset.poi){S.poiSel=el.dataset.poi;renderPanel();drawDyn();setTimeout(()=>document.querySelector('.pc[aria-pressed=true]')?.scrollIntoView({block:'nearest',behavior:'smooth'}),50)}}
// 시트 끌기(모바일)
(function(){const sh=$('#sheet'),gb=$('#grab');let y0=null,h0=0;
  const setState=s=>{S.sheet=s;sh.classList.remove('min','max');if(s!=='mid')sh.classList.add(s)};
  gb.addEventListener('click',()=>{if(moved2>6)return;setState(S.sheet==='mid'?'max':S.sheet==='max'?'min':'mid');setTimeout(focusSel,300)});
  let moved2=0;gb.addEventListener('pointerdown',e=>{y0=e.clientY;h0=sh.getBoundingClientRect().height;moved2=0;gb.setPointerCapture(e.pointerId);sh.classList.add('nodrag')});
  gb.addEventListener('pointermove',e=>{if(y0==null)return;const dy=e.clientY-y0;moved2=Math.abs(dy);sh.style.height=Math.max(120,Math.min(innerHeight-70,h0-dy))+'px'});
  gb.addEventListener('pointerup',e=>{if(y0==null)return;sh.classList.remove('nodrag');const h=sh.getBoundingClientRect().height;sh.style.height='';y0=null;
    if(moved2>6){setState(h<innerHeight*.3?'min':h>innerHeight*.66?'max':'mid');setTimeout(focusSel,300)}})})();
$('#zin').addEventListener('click',()=>zoomBtn(.7));$('#zout').addEventListener('click',()=>zoomBtn(1.4));$('#zfit').addEventListener('click',focusSel);
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(focusSel,150)});

/* ---------- 시작 ---------- */
$('#zin').innerHTML=IC.plus;$('#zout').innerHTML=IC.minus;$('#zfit').innerHTML=IC.target;$('#helpBtn').innerHTML=IC.help;$('#helpBtn').addEventListener('click',openHelp);
setDay(location.hash.slice(1));initMap();render();setTimeout(focusSel,30);

</script>
